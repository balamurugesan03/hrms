# Paste these blocks INSIDE the existing `server { ... }` block for unizova.com
# (usually /etc/nginx/sites-available/unizova.com or /etc/nginx/conf.d/*.conf),
# then run: sudo nginx -t && sudo systemctl reload nginx

location ^~ /hrms/api/ {
    proxy_pass http://127.0.0.1:5000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10m;
}

location ^~ /hrms/uploads/ {
    proxy_pass http://127.0.0.1:5000/uploads/;
    proxy_set_header Host $host;
}

location ^~ /hrms/ {
    alias /var/www/hrms/frontend/dist/;
    try_files $uri $uri/ /hrms/index.html;
}

location = /hrms {
    return 301 /hrms/;
}
